<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <h1>Currency Converter</h1>

    <form id="converterForm" class="converter-form">
      <div class="amount-group">
        <label for="amount">Amount</label>
        <input type="number" id="amount" value="1" min="0" step="any" required>
      </div>

      <div class="currency-row">
        <div class="currency-group">
          <label for="fromCurrency">From</label>
          <select id="fromCurrency"></select>
        </div>

        <button type="button" id="swapBtn" class="swap-btn" title="Swap currencies">⇄</button>

        <div class="currency-group">
          <label for="toCurrency">To</label>
          <select id="toCurrency"></select>
        </div>
      </div>

      <button type="submit" class="btn-primary">Convert</button>
    </form>

    <div id="loading" class="loading hidden">Converting...</div>
    <div id="errorMessage" class="error-message hidden"></div>

    <div id="result" class="result hidden"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
